<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css">
    <style>

        p
        {
            margin : 0;
            padding: 0;
            font-size: 30px;
            font-weight: bold;

            width: 200px;
            height: 50px;
            background-color: #960000;
            color : white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tela
        {
            border : 5px solid #960000;            
            box-sizing: border-box;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }


    </style>
</head>
<body>

    <div class="tela">

        <div class="between">
            <p>Guilherme</p>
            <p>Ana</p>
        </div>

        <div class="between">
            <p>Gustavo</p>
            <p>Felipe</p>
        </div>

    </div>
    
</body>
</html>
